# Fork-only: builds the personal desktop app and server package and publishes
# them as a GitHub Release on this fork. Installed with scripts/fork/update-*.sh.
# Runs on every push to main; the fork sync workflow dispatches it explicitly.
name: Fork release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Full version to build (default 0.0.<patch+1>-fork.<date>.<run>)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: fork-release
  cancel-in-progress: true

jobs:
  version:
    name: Choose version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /apps/server/package.json
          sparse-checkout-cone-mode: false

      - id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_VERSION" ]]; then
            version="$INPUT_VERSION"
          else
            # Bump the patch so the fork sorts above the same upstream base
            # release: a 0.0.40-fork.x prerelease would sort below stable
            # 0.0.40 and the app would offer the official build as an update.
            base="$(node -p "require('./apps/server/package.json').version")"
            base="${base%%-*}"
            IFS=. read -r major minor patch <<<"$base"
            version="${major}.${minor}.$((patch + 1))-fork.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building fork version $version"

  desktop:
    name: Build macOS Apple Silicon app
    needs: version
    runs-on: macos-15
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install desktop dependencies
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Cache resource monitor
        id: resource_monitor_cache
        uses: actions/cache@v6
        with:
          path: native/resource-monitor/target/aarch64-apple-darwin/release/t3-resource-monitor
          key: resource-monitor-aarch64-apple-darwin-${{ hashFiles('native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Setup Rust
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Set version and public configuration
        shell: bash
        run: |
          set -euo pipefail
          node scripts/update-release-package-versions.ts "$VERSION"
          cp .env.example .env

      - name: Build unsigned macOS app
        shell: bash
        env:
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: ${{ steps.resource_monitor_cache.outputs.cache-hit == 'true' }}
        run: |
          set -euo pipefail
          vp run dist:desktop:artifact \
            --platform mac \
            --target dmg \
            --arch arm64 \
            --build-version "$VERSION" \
            --verbose

      # The build has no Developer ID, so the bundle comes out with no
      # signature at all and Apple Silicon refuses to launch it. Sign it ad hoc
      # and repack both the zip (used by update-desktop.sh) and a DMG with an
      # Applications shortcut (for manual installs).
      - name: Sign ad hoc and repack
        shell: bash
        run: |
          set -euo pipefail
          cd release
          shopt -s nullglob
          zips=(*-arm64.zip)
          (( ${#zips[@]} == 1 )) || { echo "Expected one arm64 zip, found ${#zips[@]}." >&2; exit 1; }
          zip_name="${zips[0]}"
          dmg_name="${zip_name%.zip}.dmg"

          rm -rf stage dmgroot
          mkdir stage dmgroot
          ditto -x -k "$zip_name" stage
          apps=(stage/*.app)
          (( ${#apps[@]} == 1 )) || { echo "Expected one .app in the zip, found ${#apps[@]}." >&2; exit 1; }
          app="${apps[0]}"
          app_name="$(basename "$app")"

          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"

          rm -f -- *.dmg *.zip *.blockmap latest-mac.yml
          ditto "$app" "dmgroot/$app_name"
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "T3 Code fork $VERSION" -srcfolder dmgroot -ov -format UDZO "$dmg_name"
          (cd stage && ditto -c -k --keepParent "$app_name" "../$zip_name")
          rm -rf stage dmgroot
          ls -la

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: fork-desktop-arm64
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 7

  server:
    name: Build server package
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install server dependencies
        run: vp install --filter=t3... --filter=@t3tools/scripts...

      - name: Set version and public configuration
        shell: bash
        run: |
          set -euo pipefail
          node scripts/update-release-package-versions.ts "$VERSION"
          cp .env.example .env

      - name: Build server bundle
        run: vp run --filter t3 build

      - name: Pack server tarball
        run: node scripts/fork/pack-server.mjs --version "$VERSION" --out release

      - name: Upload server artifact
        uses: actions/upload-artifact@v7
        with:
          name: fork-server
          path: release/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [version, desktop, server]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: fork-*
          merge-multiple: true
          path: release

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la release
          tag="fork-v${VERSION}"
          notes="$(cat <<END
          Personal fork build of T3 Code from ${GITHUB_SHA:0:7}.

          Update a Mac (quit T3 Code first):
          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/scripts/fork/update-desktop.sh | bash
          \`\`\`

          Update a server host running the systemd user service:
          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/scripts/fork/update-server.sh | bash
          \`\`\`

          The app is signed ad hoc, not notarized. Installing the DMG by hand needs \`xattr -d com.apple.quarantine\` on the downloaded file.
          END
          )"
          gh release create "$tag" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --latest \
            --title "T3 Code fork ${VERSION}" \
            --notes "$notes"
